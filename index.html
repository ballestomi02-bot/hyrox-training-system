:root{--bg:#0d0f0d;--paper:#171a17;--ink:#f5f5ef;--muted:#a5aaa0;--olive:#c6dda1;--olive-dark:#b3ce8b;--olive-pale:#252d22;--line:#30352e;--soft:#222720;--orange:#ffc4ac;--pastel-lilac:#ddc5ff;--pastel-mint:#b8ebcf;--pastel-blue:#b9dcff;--pastel-pink:#ffc5da}

let supabase=null,session=null,activeTab='home',planFilter='Todos',historyFilter='Todos',draft=null,toastTimer=null,syncTimer=null;
function emptyState(){return {logs:[],recovery:[],activePlanId:null,customWorkouts:[],activeSession:null,steps:{},stepsEnabled:false}}
function normalizeState(x){const d=emptyState();return Object.assign(d,x||{}, {logs:Array.isArray(x?.logs)?x.logs:[],recovery:Array.isArray(x?.recovery)?x.recovery:[],customWorkouts:Array.isArray(x?.customWorkouts)?x.customWorkouts:[],steps:x?.steps&&typeof x.steps==='object'?x.steps:{},stepsEnabled:Boolean(x?.stepsEnabled)})}
function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY)))}catch(e){return emptyState()}}
let state=load();
function persist(){localStorage.setItem(KEY,JSON.stringify(state));const userId=session?.user?.id;if(userId&&supabase){const payload=JSON.parse(JSON.stringify(state));clearTimeout(syncTimer);syncTimer=setTimeout(()=>supabase.from('training_data').upsert({user_id:userId,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'}).then(({error})=>{if(error)toast('No se pudo sincronizar. Revisá tu conexión.')}),450)}}
async function syncTodaySteps(requestPermission){
if(!window.Capacitor?.isNativePlatform?.()||!window.hyroxSteps){toast('El conteo automático está disponible en la app de iPhone.');return}
try{if(requestPermission){await window.hyroxSteps.requestAuthorization();state.stepsEnabled=true}const result=await window.hyroxSteps.readToday(),date=todayISO(),count=Math.max(0,Math.floor(Number(result.steps)||0));state.steps[date]={count,syncedAt:new Date().toISOString()};persist();render();toast(count?'Pasos actualizados':'Salud todavía no muestra pasos de hoy')}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(v,opts){if(!v)return '';return new Date(v+'T12:00:00').toLocaleDateString('es-AR',opts||{weekday:'short',day:'numeric',month:'short'})}
function weekDays(){let d=new Date();let start=new Date(d);start.setDate(d.getDate()-(d.getDay()+6)%7);return Array.from({length:7},(_,i)=>{let x=new Date(start);x.setDate(start.getDate()+i);return x})}
function kindIcon(kind){return kind==='Running'?'⌁':kind==='Fuerza'?'⬡':kind==='Recuperación'?'♡':'◉'}

function allRecent(){return (state.logs||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))}

function renderHome(){
const wk=thisWeekLogs(),kms=wk.reduce((a,x)=>a+(+x.distance||0),0),min=wk.reduce((a,x)=>a+(+x.duration||0),0),days=weekDays(),done=new Set(wk.map(x=>x.date)),p=activePlan(),latest=allRecent()[0],rec=state.recovery.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],completed=Math.min(wk.length,4),pct=Math.round(completed/4*100),today=new Date();

function renderHistory(){

document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;document.getElementById('authMessage').textContent='Conectando…';const {error}=await supabase.auth.signInWithPassword({email,password});document.getElementById('authMessage').textContent=error?error.message:''});
document.getElementById('logoutButton').addEventListener('click',async()=>{clearTimeout(syncTimer);if(session&&supabase){const {error}=await supabase.from('training_data').upsert({user_id:session.user.id,payload:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('No se pudo sincronizar antes de salir.')}await supabase.auth.signOut();state=emptyState();localStorage.removeItem(KEY)});

document.getElementById('sheetRoot').addEventListener('submit',async e=>{if(e.target.id!=='changePasswordForm')return;e.preventDefault();const currentPassword=document.getElementById('currentPassword').value,newPassword=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmPassword').value,message=document.getElementById('passwordMessage'),save=document.getElementById('passwordSaveButton');if(newPassword.length<8){message.textContent='La contraseña debe tener al menos 8 caracteres.';return}if(newPassword!==confirmPassword){message.textContent='Las contraseñas nuevas no coinciden.';return}save.disabled=true;message.textContent='Verificando…';const {error:loginError}=await supabase.auth.signInWithPassword({email:session.user.email,password:currentPassword});if(loginError){message.textContent='La contraseña actual no es correcta.';save.disabled=false;return}message.textContent='Actualizando…';const {error}=await supabase.auth.updateUser({password:newPassword});if(error){message.textContent=error.message;save.disabled=false;return}document.getElementById('sheetRoot').innerHTML='';toast('Contraseña actualizada')});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}const a=b.dataset.action;if(a==='sync-steps'){syncTodaySteps(true);return}else if(a==='change-password'){showPasswordSheet();return}if(a==='choose-plan'){state.activePlanId=b.dataset.id;persist();render();toast('Plan agregado a tu semana')}else if(a==='clear-plan'){state.activePlanId=null;persist();render()}else if(a==='begin-plan-session')startPlanSession(b.dataset.plan,+b.dataset.index);else if(a==='quick-start')beginSession('Entrenamiento libre','HYROX',45,[],{});else if(a==='start-custom')startCustom(b.dataset.id);else if(a==='new-custom'){draft={name:'',kind:'HYROX',exercises:[],notes:''};render()}else if(a==='builder-cancel'){draft=null;render()}else if(a==='builder-add')showBuilderPicker();else if(a==='builder-remove'){draft.exercises.splice(+b.dataset.index,1);render()}else if(a==='builder-save'){draft.name=document.getElementById('customName').value.trim();draft.kind=document.getElementById('customKind').value;draft.notes=document.getElementById('customNotes').value.trim();if(!draft.name||!draft.exercises.length){toast('Agregá un nombre y al menos un ejercicio');return}const w={...draft,id:'custom-'+Date.now(),category:draft.kind,level:'Personal',weeks:1,days:1,icon:'✦',blurb:draft.exercises.length+' ejercicios · Tu sesión personalizada'};state.customWorkouts.push(w);persist();draft=null;render();toast('Entrenamiento guardado')}else if(a==='exercise-picker')showExercisePicker('runner');else if(a==='confirm-exercise'){const name=document.getElementById('exerciseChoice').value,n=Math.max(1,+document.getElementById('exerciseSets').value||3);state.activeSession.exercises.push({name,sets:Array.from({length:n},()=>({reps:'8',weight:'',done:false}))});persist();document.getElementById('sheetRoot').innerHTML='';render()}else if(a==='confirm-builder-exercise'){draft.exercises.push({name:document.getElementById('builderExercise').value,sets:Math.max(1,+document.getElementById('builderSets').value||3),reps:document.getElementById('builderReps').value||'8'});document.getElementById('sheetRoot').innerHTML='';render()}else if(a==='dismiss-sheet'){document.getElementById('sheetRoot').innerHTML=''}else if(a==='add-set'){state.activeSession.exercises[+b.dataset.ei].sets.push({reps:'8',weight:'',done:false});persist();render()}else if(a==='remove-exercise'){state.activeSession.exercises.splice(+b.dataset.index,1);persist();render()}else if(a==='toggle-set'){const s=state.activeSession.exercises[+b.dataset.ei].sets[+b.dataset.si];s.done=!s.done;persist();render()}else if(a==='set-rpe'){state.activeSession.rpe=+b.dataset.value;persist();render()}else if(a==='finish-session')finishSession();else if(a==='cancel-session'){if(confirm('¿Salir de esta sesión? El progreso de esta sesión no se guardará.')){state.activeSession=null;persist();render()}}else if(b.dataset.filter){planFilter=b.dataset.filter;render()}else if(b.dataset.historyFilter){historyFilter=b.dataset.historyFilter;render()}});
document.getElementById('view').addEventListener('input',e=>{const t=e.target;if(draft&&t.id==='customName')draft.name=t.value;if(draft&&t.id==='customKind')draft.kind=t.value;if(draft&&t.id==='customNotes')draft.notes=t.value;if(t.dataset.sessionField){const ex=state.activeSession?.exercises?.[+t.dataset.ei];if(t.dataset.sessionField==='notes')state.activeSession.notes=t.value;else if(t.dataset.sessionField==='distance')state.activeSession.distance=t.value;else if(t.dataset.sessionField==='duration')state.activeSession.actualDuration=t.value;else if(ex)ex.sets[+t.dataset.si][t.dataset.sessionField]=t.value;persist()}});
document.getElementById('view').addEventListener('submit',e=>{if(e.target.id!=='recoveryForm')return;e.preventDefault();const g=id=>document.getElementById(id)?.value||'',getScale=k=>document.querySelector('[data-scale="'+k+'"].active')?.dataset.value||'';const r={id:Date.now(),date:todayISO(),sleep:g('sleep'),sleepQuality:getScale('sleepQuality'),energy:getScale('energy'),fatigue:getScale('fatigue'),stress:getScale('stress'),pain:g('pain')||'0',painArea:g('painArea'),notes:''};state.recovery.push(r);persist();render();toast('Check-in guardado')});
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('[data-scale]');if(!b)return;document.querySelectorAll('[data-scale="'+b.dataset.scale+'"]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.getElementById('sheetRoot').addEventListener('click',e=>{if(e.target.classList?.contains('dialog-backdrop'))e.target.innerHTML=''});
document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='pain')document.getElementById('painValue').textContent=e.target.value+'/10'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
startApp().catch(error=>{console.error(error);document.getElementById('authMessage').textContent='No se pudo iniciar la conexión.'});
</script></body></html>
